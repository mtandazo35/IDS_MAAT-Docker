# ids-maat — release (CONTRATO-F1a §6.4). Solo con etiquetas v*. Imágenes firmadas con cosign keyless;
# release.json firmado con sign-blob. El instalador verifica la identidad de este workflow.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  COSIGN_VERSION: v2.6.5
  COSIGN_SHA256: c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644

jobs:
  # El commit etiquetado ya pasó ci.yml entero al subirlo: aquí no se repite (eran ~22 min por
  # release). Si no tiene un ci.yml en verde (aún corre, falló o nunca se subió a una rama), la
  # release se para aquí; se vuelve a lanzar cuando el CI esté verde.
  ci-verde:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: ci.yml en verde para el commit etiquetado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" \
                --jq '.total_count')
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::${GITHUB_SHA} no tiene un ci.yml en verde: espera a que termine (o arréglalo) y relanza la release"
            exit 1
          fi
          echo "ci.yml en verde para ${GITHUB_SHA}"

  imagen:
    needs: ci-verde
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        img: [panel, vpn, suricata]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: base fijada y serie de Suricata
        id: base
        run: |
          echo "imagen=$(sed -n 's/^BASE_IMAGE=//p' images/base.env)" >> "$GITHUB_OUTPUT"
          echo "suricata_serie=$(sed -n 's/^ARG SURICATA_VERSION=//p' images/suricata/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mtandazo35/ids-maat-${{ matrix.img }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ matrix.img }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          # SURICATA_VERSION = serie (7.0) para la etiqueta ids-maat.suricata-version; la versión
          # exacta la lee el job release de /usr/share/ids-maat/suricata-version y va en release.json
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.imagen }}
            VERSION=${{ steps.meta.outputs.version }}
            ${{ matrix.img == 'suricata' && format('SURICATA_VERSION={0}', steps.base.outputs.suricata_serie) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: cosign sign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMG: ${{ matrix.img }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cosign" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/cosign"
          "$RUNNER_TEMP/cosign" sign --yes "ghcr.io/mtandazo35/ids-maat-${IMG}@${DIGEST}"

  release:
    needs: imagen
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: release.json, tar del host y firma
        env:
          ETIQUETA: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${ETIQUETA#v}"
          curl -fsSL -o "$RUNNER_TEMP/cosign" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/cosign"
          digest() {
            docker buildx imagetools inspect "ghcr.io/mtandazo35/ids-maat-$1:$v" --format '{{json .Manifest}}' \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])'
          }
          ref_vpn="ghcr.io/mtandazo35/ids-maat-vpn@$(digest vpn)"
          ref_suricata="ghcr.io/mtandazo35/ids-maat-suricata@$(digest suricata)"
          ref_panel="ghcr.io/mtandazo35/ids-maat-panel@$(digest panel)"
          # versión exacta de Suricata: solo se conoce dentro de la imagen (la etiqueta lleva la serie)
          docker pull -q "$ref_suricata" >/dev/null
          suricata_version=$(docker run --rm --network none --entrypoint cat "$ref_suricata" \
            /usr/share/ids-maat/suricata-version)
          tar_nombre="ids-maat-host-$v.tar.gz"
          git archive --format=tar.gz -o "$tar_nombre" HEAD orquestador host install.sh
          python3 .github/scripts/release_json.py --version "$v" --vpn "$ref_vpn" \
            --suricata "$ref_suricata" --panel "$ref_panel" --suricata-version "$suricata_version" \
            --tar "$tar_nombre" > release.json
          cat release.json
          "$RUNNER_TEMP/cosign" sign-blob --yes --bundle release.json.bundle release.json
          gh release create "$ETIQUETA" --title "ids-maat $ETIQUETA" --verify-tag \
            --notes "Imágenes por digest y tar del host en release.json (firma: release.json.bundle)." \
            release.json release.json.bundle "$tar_nombre"

  # Los paquetes de GHCR nacen privados aunque el repo sea público y la API no deja cambiarlo en
  # paquetes de usuario: este job falla (en rojo, con el enlace) hasta que se hagan públicos una vez
  # en la web. La release ya está publicada; basta con cambiar la visibilidad y relanzar el job.
  visibilidad:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: imágenes descargables sin credenciales
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: python3 .github/scripts/ghcr_publico.py --estricto "${ETIQUETA#v}" panel vpn suricata
