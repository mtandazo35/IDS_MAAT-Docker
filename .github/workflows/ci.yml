# ids-maat — CI (CONTRATO-F1a §6.4). Acciones fijadas por SHA de commit (Dependabot/Renovate las suben).
name: ci

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  # solo para las pruebas (pip, rueda binaria); la imagen del panel usa python3-cryptography de Debian
  CRYPTOGRAPHY_CI: "44.0.2"
  # PyYAML real para validar la sintaxis de los workflows y del compose renderizado (auditoría
  # B-01): sus pruebas son obligatorias (tests/obligatorias.txt), así que aquí no pueden omitirse
  PYYAML_CI: "6.0.2"
  # informe PDF del panel (en la imagen es python3-reportlab de Debian)
  REPORTLAB_CI: "4.4.4"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: pyflakes (*.py y shebang python3 bajo images/*/rootfs)
        run: |
          python -m pip install --quiet pyflakes==3.2.0
          mapfile -t py < <(python .github/scripts/lint.py python)
          python -m pyflakes "${py[@]}"
      - name: bash -n y shellcheck (*.sh y shebang sh/bash)
        run: |
          mapfile -t sh < <(python .github/scripts/lint.py shell)
          for f in "${sh[@]}"; do bash -n "$f"; done
          shellcheck --severity=warning "${sh[@]}"
      - name: finales LF y sin BOM
        run: python -m unittest discover -s tests -p "test_ci_eol.py"
      - name: tailwind.css del panel al día (CLI fijado por versión y SHA-256; images/panel/tailwind)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tailwindcss"             https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          echo "7d24f7fa191d2193b78cd5f5a42a6093e14409521908529f42d80b11fde1f1d4  $RUNNER_TEMP/tailwindcss" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tailwindcss"
          TAILWIND="$RUNNER_TEMP/tailwindcss" sh images/panel/tailwind/build.sh
          git diff --exit-code -- images/panel/rootfs/usr/local/share/ids-panel/tailwind.css             || { echo "tailwind.css desactualizado: ejecuta images/panel/tailwind/build.sh y commitea"; exit 1; }
      - name: sintaxis YAML de los workflows y del compose renderizado (PyYAML)
        run: |
          python -m pip install --quiet --only-binary=:all: "pyyaml==${PYYAML_CI}"
          cd tests && python -m unittest -v test_f3_ci.YamlReal
      - name: nft -c de los .nft renderizados (debian:trixie-slim, NET_ADMIN)
        run: |
          python .github/scripts/render_nft.py "$RUNNER_TEMP/nft"
          base=$(sed -n 's/^BASE_IMAGE=//p' images/base.env)
          docker run --rm --cap-add NET_ADMIN -v "$RUNNER_TEMP/nft:/nft:ro" "$base" sh -ec \
            'apt-get update -qq; apt-get install -y -qq --no-install-recommends nftables iproute2 >/dev/null; ip link add ids-mon type dummy; for f in /nft/*.nft; do echo "nft -c $f"; nft -c -f "$f"; done'

  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: herramientas que las pruebas usan de verdad si están (fail2ban-regex, logrotate, openssl)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fail2ban logrotate openssl >/dev/null
      - name: cryptography para secretos.py (en la imagen es python3-cryptography de Debian) y PyYAML
        run: |
          python -m pip install --quiet --only-binary=:all: "cryptography==${CRYPTOGRAPHY_CI}" "pyyaml==${PYYAML_CI}" "reportlab==${REPORTLAB_CI}"
      - name: tests/run.sh (resultados y omisiones con su motivo en el resumen del job)
        env:
          IDS_OBLIGATORIAS: linux
          IDS_SH_OBLIGATORIAS: "1"
        run: IDS_RESUMEN="$GITHUB_STEP_SUMMARY" bash tests/run.sh

  # Sin job de Windows desde 2026-10-15 (decisión del dueño): el IDS solo corre en Linux y todo
  # se prueba en la VPS y aquí.

  imagenes:
    runs-on: ubuntu-24.04
    needs: [lint, pruebas]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: herramientas y paquetes de las pruebas (se repiten como root, con obligatorias)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fail2ban logrotate openssl >/dev/null
          python -m pip install --quiet --only-binary=:all: "cryptography==${CRYPTOGRAPHY_CI}" "pyyaml==${PYYAML_CI}" "reportlab==${REPORTLAB_CI}"
      - name: build de las imágenes (sin publicar)
        run: |
          bash images/build.sh vpn ci
          bash images/build.sh suricata ci
          bash images/build.sh panel ci
      - name: pruebas de imagen e integración (root + Docker)
        env:
          IDS_IMG_VPN: ids-maat-vpn:ci
          IDS_IMG_SURICATA: ids-maat-suricata:ci
          IDS_IMG_PANEL: ids-maat-panel:ci
          IDS_SH_OBLIGATORIAS: "1"
          # obligatorias de linux y las que solo corren como root (master.key 0440 root:10500)
          IDS_OBLIGATORIAS: root
        run: sudo -E env "PATH=$PATH" "IDS_RESUMEN=$GITHUB_STEP_SUMMARY" bash tests/run.sh --imagenes --integracion
