# disable-reducido.conf — ids-maat. Lo que quita el perfil reducido (además de
# disable-comun.conf), sobre la MISMA descarga que completo (suricata-update --offline).
# Sintaxis de suricata-update (disable.conf): sid, gid:sid, group:<fichero>, re:<regex>.
#
# Grupos de ET Open de política, inventario y caza: mucho volumen en un espejo de ISP y
# poca señal de infección. La lista exacta se fija con las mediciones del canario (F1a).
#
# NO puede quitar el sid 2100498 (GPL ATTACK_RESPONSE id check returned root, en
# emerging-attack_response.rules): es la regla de la prueba de extremo a extremo y debe
# estar en los dos perfiles. ids-reglas lo comprueba y falla si falta.
group:emerging-policy.rules
group:emerging-info.rules
group:emerging-games.rules
group:emerging-chat.rules
group:emerging-inappropriate.rules
group:emerging-hunting.rules
