/srv/ids/datos/*/eve.json /srv/ids/datos/*/dns.json {
    maxsize 1G
    maxage 3
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    nocreate
    sharedscripts
    postrotate
        /usr/local/bin/ids-orq reabrir-logs >/dev/null 2>&1 || true
    endscript
}
/srv/ids/estado/orq.jsonl {
    monthly
    rotate 24
    compress
    missingok
    notifempty
    nocreate
}
