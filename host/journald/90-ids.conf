# ids-maat — /etc/systemd/journald.conf.d/90-ids.conf, lo instala install.sh (auditoría VPN-15).
# Los logs de TODOS los contenedores (driver journald) entran por docker.service y comparten su
# límite de ritmo. Con el de Debian (10000 mensajes cada 30 s) una avalancha contra la VPN de un
# punto puede descartar líneas de todos, también las «ovpn-auth: rechazado» que lee fail2ban.
# El tamaño queda fijo en vez de depender del disco (por defecto, el 10 % y hasta 4 GB), que
# comparte con los eventos de /srv/ids; SystemKeepFree se queda en el 15 % de Debian.
[Journal]
RateLimitIntervalSec=30s
RateLimitBurst=50000
SystemMaxUse=2G
