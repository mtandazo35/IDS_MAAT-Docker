# ids-maat — /etc/fail2ban/filter.d/ids-vpn.conf (CONTRATO-F1a §5.13).
# Con backend = systemd, fail2ban le antepone al MESSAGE «<_HOSTNAME> <SYSLOG_IDENTIFIER>[<_PID>]: »
# (el identificador es el tag ids-vpn del driver journald). __ids_pref admite ese prefijo sin
# desanclar la regex; sin él, las líneas del contrato tal cual también casan.
# Comprobar: fail2ban-regex -d '{NONE}' <líneas> /etc/fail2ban/filter.d/ids-vpn.conf
# Solo cuenta «ovpn-auth: rechazado» (una línea por intento; OpenVPN escribe además «TLS Auth Error»
# por el MISMO intento) y solo con motivo=formato o motivo=usuario: lo que manda quien no conoce el
# usuario (un escáner). No cuentan (VPN-04):
#   - motivo=clave: el dueño del usuario con la clave vieja (tras «Regenerar la clave VPN» o un error
#     al teclearla). Banearlo cortaba TODOS los puertos de su IP, hasta 1 semana. Ya lo frena
#     ovpn-auth: 5 intentos por IP cada 600 s y 30 scrypt por minuto en total;
#   - motivo=freno: es lo que sigue a esos 5 intentos (no dice si conocía el usuario);
#   - motivo=freno-global: salta por la carga de TODOS, no por la IP que lo encuentra.
# Desbanear: ids-orq vpn desbanear <ip> (docs/OPERACION.md §5).
[DEFAULT]
__ids_pref = (?:(?:\S+ )?ids-vpn(?:\[\d+\])?: )?

[Definition]
failregex = ^%(__ids_pref)s<HOST>:\d+ ovpn-auth: rechazado usuario=\S+ motivo=(?:formato|usuario)(?:\s|$)
ignoreregex =
